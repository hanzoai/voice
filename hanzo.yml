# hanzoai/voice — a spoken conversation over one socket.
#
# A library, not a service. `cmd/voice` runs it alone for development; in
# production hanzoai/ai imports this and mounts /v1/voice, because that is where
# the AI surface already lives and one API host is the whole point of api.hanzo.ai.
# An image here would be a second thing to build, deploy, route and operate for
# one package.
#
# `go test ./...` is the real gate here, unlike the sibling services whose suites
# need a database. Nothing in this tree opens one — the seams (Turn, Mind, Meter)
# are interfaces, and talk_test.go drives them with stand-ins, so the suite is
# hermetic and fast and belongs on every push.
test:
  - name: build-vet-test
    run: |
      set -e
      go build ./...
      go vet ./...
      go test ./...
